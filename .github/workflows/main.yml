name: Installer le selecteur telephonique

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ajouter la bibliotheque
        working-directory: perflouisgrillon
        run: |
          corepack enable
          yarn add react-phone-input-2

      - name: Enregistrer les modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perflouisgrillon/package.json perflouisgrillon/yarn.lock
          git diff --cached --quiet || git commit -m "Add international phone input dependency"
          git push
